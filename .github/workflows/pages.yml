# Publishes Dr Kashif's app to GitHub Pages whenever dr-kashif is pushed.
# Only app/ is published — the photos, PDFs and tests in the repo are not.
# Patient records are never here: they live in the browser on his PC.
name: Deploy Dr Kashif's app

on:
  push:
    branches: [dr-kashif]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
